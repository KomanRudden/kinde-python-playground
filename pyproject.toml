[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kinde-python-playground"
version = "0.1.0"
description = "Feature-rich test app for the Kinde Python SDK, runnable on Flask and FastAPI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    # Installed editable from ../kinde-python-sdk during development (see README)
    "kinde-python-sdk[flask,fastapi]>=2.4.0",
    "flask>=3.0",
    "flask-session>=0.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["playground*", "apps*"]

[tool.setuptools.package-data]
playground = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:flask_session.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
